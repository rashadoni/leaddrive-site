name: CI

# The build gate lives here on purpose. The owner's rules put session work on
# the dev server and forbid dependency installs and production builds there,
# which leaves no machine that may legitimately run `vinext build`. A public
# repository gets free GitHub-hosted Linux, so the build runs where nobody's
# laptop is involved and a broken commit is caught before wrangler deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Pull requests only. Cancelling a push-to-main run can interrupt wrangler
  # between uploading the script and publishing its routes, which leaves the
  # new code live on none of the hostnames and no red check to say so.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: vinext imports `glob` from node:fs/promises, which
          # only exists from Node 22. On 20 the build dies at import time with
          # "does not provide an export named 'glob'".
          node-version: "22"
          cache: npm
      - run: npm ci
      # Advisory, not a gate. oxlint reports 19 pre-existing violations on main,
      # almost all in vendored shadcn components (role="group", role="link" and
      # friends). A check that is red before anyone touches it teaches people to
      # ignore it. The build below is the real gate: it is what breaks
      # `wrangler deploy`. Make lint blocking once the backlog is cleared.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify build output exists
        run: test -d dist || { echo "::error::build produced no dist/"; exit 1; }

      # Runs on every pull request, not just on deploy, so a vinext upgrade that
      # changes the generated config turns a PR red instead of quietly breaking
      # a production deploy.
      - name: Check the deploy config can be generated
        run: node scripts/cf-deploy-config.mjs

  deploy:
    # Deliberately NOT a required status check. Required checks must be able to
    # report on every pull request; this job only ever runs on main, so adding it
    # to the required list would block every PR forever waiting for a run that
    # cannot happen.
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # A unique marker per run. Without it "the site returns 200" proves only
      # that the OLD code is still up; Cloudflare answers from cache even with
      # max-age=0, so a cache-busting query alone is not proof either.
      - name: Stamp this build
        run: |
          printf '{"sha":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > public/build-stamp.json
          cat public/build-stamp.json

      - name: Build
        run: npm run build

      # If public/ ever stops being copied into the asset directory, the
      # post-deploy check below would 404 on a perfectly healthy site and read as
      # an outage. Catch that here, before anything is published.
      - name: Verify the stamp survived the build
        run: |
          test -f dist/client/build-stamp.json || {
            echo "::error::public/ was not copied into dist/client — post-deploy verification cannot work"; exit 1; }
          grep -q "$GITHUB_SHA" dist/client/build-stamp.json || {
            echo "::error::dist/client/build-stamp.json does not carry this commit"; exit 1; }

      - name: Generate the deploy config
        run: node scripts/cf-deploy-config.mjs

      # The token is set on this step alone. npm ci above executes lifecycle
      # scripts from a large beta dependency tree in a public repository; a
      # workflow- or job-level secret would be in scope for every one of them.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-out.ndjson
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable is not set"; exit 1; }
          npx wrangler deploy \
            --config dist/server/wrangler.deploy.json \
            --experimental-autoconfig=false \
            --message "$GITHUB_SHA via run $GITHUB_RUN_ID"

      # Diagnostics only. The live check below is the actual gate: a unique stamp
      # served from all three hostnames proves more than wrangler's own report of
      # what it thinks it published.
      - name: Show what wrangler reported
        if: always()
        run: cat "${{ runner.temp }}/wrangler-out.ndjson" 2>/dev/null || echo "(no wrangler output file)"

      - name: Verify the live site serves this build
        run: |
          set -u
          fail=0
          for host in leaddrivecrm.org www.leaddrivecrm.org new.leaddrivecrm.org; do
            ok=0
            for attempt in 1 2 3 4 5; do
              body=$(curl -fsS --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "https://$host/build-stamp.json?cb=${GITHUB_RUN_ID}-${attempt}" || true)
              case "$body" in
                *"$GITHUB_SHA"*) ok=1; break ;;
              esac
              sleep $((attempt * 5))
            done
            if [ "$ok" = 1 ]; then
              echo "  ok    $host serves $GITHUB_SHA"
            else
              echo "::error::$host is not serving $GITHUB_SHA (last body: ${body:-<empty>})"
              fail=1
            fi
          done
          exit $fail
